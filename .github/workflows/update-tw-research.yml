name: Update TW research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/core/classic*.js', 'server/markets/tw/classic-provider.js', 'server/markets/tw/research*.js', 'server/markets/tw/pattern-snapshot.js', 'src/markets/tw/patterns/model.js', 'src/components/patterns/matcher.js', 'scripts/collect-tw-patterns.mjs', 'scripts/collect-tw-research.mjs', 'scripts/collect-tw-radar.mjs', 'server/markets/tw/surveillance.js', 'api/v1/tw/providers/radar.js', 'tests/tw-radar-close-source.test.mjs', '.github/workflows/update-tw-research.yml']
  schedule:
    # UTC -> Taipei: 13:35, 14:10, 15:40, 18:35, 20:35.
    - cron: '35 5 * * 1-5'
    - cron: '40 5 * * 1-5'
    - cron: '10 6 * * 1-5'
    - cron: '40 7 * * 1-5'
    - cron: '35 10 * * 1-5'
    - cron: '35 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tw-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tw-research.test.mjs tests/tw-research-coverage.test.mjs tests/tw-radar-close-source.test.mjs
      - name: Collect radar with bounded source retries
        run: |
          for attempt in 1 2 3; do
            if node scripts/collect-tw-radar.mjs; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
          done
          exit 1
        id: radar
        continue-on-error: true
      - name: Collect research with bounded source retries
        run: |
          for attempt in 1 2 3; do
            if node scripts/collect-tw-research.mjs --backfill; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
          done
          exit 1
        id: research
        continue-on-error: true
      - name: Publish verified closing quotes before pattern classification
        run: |
          git add data/tw-radar.json data/tw-research.json data/tw-research-history.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(tw): update verified closing quotes and institutional data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - run: node scripts/collect-tw-patterns.mjs --curl
        id: patterns
        if: steps.research.outcome == 'success'
        continue-on-error: true
      - name: Save verified snapshot
        run: |
          git add data/tw-patterns
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(tw): update official research snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Report incomplete sources after preserving successful data
        if: steps.radar.outcome == 'failure' || steps.research.outcome == 'failure' || steps.patterns.outcome == 'failure'
        run: exit 1
