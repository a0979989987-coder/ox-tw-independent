name: Update TW research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/core/classic*.js', 'server/markets/tw/classic-provider.js', 'server/markets/tw/research*.js', 'server/markets/tw/pattern-snapshot.js', 'src/markets/tw/patterns/model.js', 'src/components/patterns/matcher.js', 'scripts/collect-tw-patterns.mjs', 'scripts/collect-tw-research.mjs', 'scripts/collect-tw-radar.mjs', 'server/markets/tw/surveillance.js', 'api/v1/tw/providers/radar.js', 'tests/tw-radar-close-source.test.mjs', '.github/workflows/update-tw-research.yml']
  schedule:
    # UTC -> Taipei: 13:35, 14:10, 15:40, 18:35, 20:35.
    - cron: '35 5 * * 1-5'
    - cron: '40 5 * * 1-5'
    - cron: '10 6 * * 1-5'
    - cron: '40 7 * * 1-5'
    - cron: '35 10 * * 1-5'
    - cron: '35 12 * * 1-5'
permissions: {}
concurrency:
  group: tw-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      radar: ${{ steps.radar.outcome }}
      research: ${{ steps.research.outcome }}
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tw-research.test.mjs tests/tw-research-coverage.test.mjs tests/tw-radar-close-source.test.mjs
      - name: Collect radar with bounded source retries
        run: |
          for attempt in 1 2 3; do
            if node scripts/collect-tw-radar.mjs; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
          done
          exit 1
        id: radar
        continue-on-error: true
      - name: Collect research with bounded source retries
        run: |
          for attempt in 1 2 3; do
            if node scripts/collect-tw-research.mjs --backfill; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
          done
          exit 1
        id: research
        continue-on-error: true
      - name: Package verified closing quotes
        id: package
        env:
          DATA_PATHS: data/tw-radar.json data/tw-research.json data/tw-research-history.json
        run: |
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $DATA_PATHS)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # shellcheck disable=SC2086
          tar -czf "$RUNNER_TEMP/data-update.tgz" -- $DATA_PATHS
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.changed == 'true'
        with:
          name: tw-quotes-data
          path: ${{ runner.temp }}/data-update.tgz
          retention-days: 1
          if-no-files-found: error
  # Verified closing quotes are published before pattern classification.
  publish-quotes:
    needs: quotes
    if: needs.quotes.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/commit-data.yml
    with:
      artifact: tw-quotes-data
      paths: data/tw-radar.json data/tw-research.json data/tw-research-history.json
      message: 'data(tw): update verified closing quotes and institutional data'
  patterns:
    needs: quotes
    if: needs.quotes.outputs.research == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      patterns: ${{ steps.patterns.outcome }}
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: needs.quotes.outputs.changed == 'true'
        with:
          name: tw-quotes-data
          path: ${{ runner.temp }}/quotes
      - name: Use this run's verified research snapshot
        if: needs.quotes.outputs.changed == 'true'
        run: tar -xzf "$RUNNER_TEMP/quotes/data-update.tgz" --no-same-owner --no-same-permissions data/tw-research.json
      - run: node scripts/collect-tw-patterns.mjs --curl
        id: patterns
        continue-on-error: true
      - name: Package verified pattern snapshot
        id: package
        env:
          DATA_PATHS: data/tw-patterns
        run: |
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $DATA_PATHS)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # shellcheck disable=SC2086
          tar -czf "$RUNNER_TEMP/data-update.tgz" -- $DATA_PATHS
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.changed == 'true'
        with:
          name: tw-patterns-data
          path: ${{ runner.temp }}/data-update.tgz
          retention-days: 1
          if-no-files-found: error
  publish-patterns:
    needs: [patterns, publish-quotes]
    if: ${{ !cancelled() && needs.patterns.outputs.changed == 'true' && needs.publish-quotes.result != 'failure' }}
    permissions:
      contents: write
    uses: ./.github/workflows/commit-data.yml
    with:
      artifact: tw-patterns-data
      paths: data/tw-patterns
      message: 'data(tw): update official research snapshot'
  report:
    needs: [quotes, patterns]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report incomplete sources after preserving successful data
        if: needs.quotes.outputs.radar == 'failure' || needs.quotes.outputs.research == 'failure' || needs.patterns.outputs.patterns == 'failure'
        run: exit 1
      - run: echo "All sources collected"
