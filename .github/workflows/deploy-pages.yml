name: Publish Taiwan market to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update TW home close and market briefing
      - Update TW research
      - Repair TW research history
      - Update TW screener and ETF holdings
      - Update official macro results
      - Update verified TW ETF data
      - Update verified news
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build:pages
        env:
          # Absolute URL for link previews (Open Graph image).
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      # Tests check the artifact just built (absolute link-preview URLs). If
      # pretest has to rebuild, it keeps the same site URL.
      - run: npm test
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      # Pages caches HTML for 10 minutes and tabs stay open for days; keep the
      # hashed CSS/JS chunks of every build version live within the last 7 days
      # (at least the previous two) so an older page never loses its assets.
      # Data-only commits keep the build version.
      - name: Retain previous build assets
        run: node scripts/retain-previous-assets.mjs
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
