name: Update verified TW ETF data
on:
  workflow_dispatch:
  schedule:
    # Asia/Taipei 14:20 and 17:20, after each market publishes its daily files.
    - cron: '20 6,9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tw-etf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/collect-tw-etf.mjs
      - run: node scripts/collect-tw-etf-extras.mjs
      - name: Save source snapshots
        run: |
          git add data/tw-etf
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(tw): refresh verified ETF data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
