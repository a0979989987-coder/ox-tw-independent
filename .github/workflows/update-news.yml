name: Update verified news

on:
  push:
    branches: [main]
    paths: ['scripts/collect-news.mjs', 'scripts/news-finance-sources.mjs', 'tests/news.test.mjs', 'scripts/news-providers.mjs', 'tests/tw-institution-detail.test.mjs']
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions: {}

concurrency:
  group: update-verified-news
  cancel-in-progress: false

jobs:
  collect:
    # Preview/manual runs on feature branches must never write production main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # No dependency needs an install script; none may run with repository access.
      - run: npm ci --ignore-scripts
      - run: npm run news:collect
      - run: node --test tests/news-time.test.mjs tests/news-macro.test.mjs tests/tw-news-collection.test.mjs
      - name: Package changed data
        id: package
        env:
          DATA_PATHS: data/news.json
        run: |
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $DATA_PATHS)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # shellcheck disable=SC2086
          tar -czf "$RUNNER_TEMP/data-update.tgz" -- $DATA_PATHS
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.changed == 'true'
        with:
          name: news-data
          path: ${{ runner.temp }}/data-update.tgz
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/commit-data.yml
    with:
      artifact: news-data
      paths: data/news.json
      message: 'data(news): refresh verified source snapshot'
