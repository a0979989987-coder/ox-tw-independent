name: Repair TW research history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-tw-research-history.yml']
permissions:
  contents: write
concurrency:
  group: tw-history-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tw-research.test.mjs tests/tw-research-coverage.test.mjs
      - name: Repair incomplete dated reports
        run: |
          for attempt in 1 2 3; do
            if node scripts/collect-tw-research.mjs --backfill; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Publish repaired research history
        run: |
          git add data/tw-research.json data/tw-research-history.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(tw): repair complete institutional history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
