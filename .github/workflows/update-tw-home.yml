name: Update TW home close and market briefing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/markets/tw/home-*.js', 'src/markets/tw/home-model.js', 'tests/tw-home*.test.mjs', 'scripts/collect-tw-home.mjs', '.github/workflows/update-tw-home.yml']
  schedule:
    # UTC 21:30 = the following day 05:30 in Asia/Taipei, every day.
    # Prewarm before 05:30; Actions scheduling can be delayed by GitHub.
    - cron: '25 21 * * *'
    # Taipei 05:30 / 05:45 / 06:15 / 07:15, including weekends and holidays.
    - cron: '30 21 * * *'
    - cron: '45 21 * * *'
    - cron: '15 22 * * *'
    - cron: '15 23 * * *'
    # Retry completed night/US close sources before the 08:30 Taipei briefing.
    - cron: '20 0 * * 1-5'
    - cron: '30 0 * * 1-5'
    - cron: '35 5 * * *'
    - cron: '40 5 * * 1-5'
    # Taipei 14:10–17:40: retry every half hour as cash/institutional sources publish.
    - cron: '10,40 6-9 * * 1-5'
    - cron: '40 10 * * 1-5'
    - cron: '40 12 * * 1-5'
permissions: {}
concurrency:
  group: tw-home-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependency needs an install script; none may run with repository access.
      - run: npm ci --ignore-scripts
      - run: node --test tests/tw-home*.test.mjs
      - run: node scripts/collect-tw-home.mjs
      - name: Report source availability
        run: |
          node --input-type=module -e 'import fs from "node:fs";const d=JSON.parse(fs.readFileSync("data/tw-home.json"));for(const s of ["core","briefing","night"]){const r=d[s+"Status"];if(r?.error)console.log("::warning title=TW "+s+"::"+r.error);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"- "+s+": "+r?.status+" · "+(d[s]?.date||d[s]?.tradeDate||"unavailable")+"\n");}'
      - name: Package changed data
        id: package
        env:
          DATA_PATHS: data/tw-home.json
        run: |
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $DATA_PATHS)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # shellcheck disable=SC2086
          tar -czf "$RUNNER_TEMP/data-update.tgz" -- $DATA_PATHS
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.changed == 'true'
        with:
          name: tw-home-data
          path: ${{ runner.temp }}/data-update.tgz
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/commit-data.yml
    with:
      artifact: tw-home-data
      paths: data/tw-home.json
      message: 'data(tw): update home close and market briefing'
