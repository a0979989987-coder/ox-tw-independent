name: Update TW home close and market briefing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/markets/tw/home-*.js', 'src/markets/tw/home-model.js', 'tests/tw-home*.test.mjs', 'scripts/collect-tw-home.mjs', '.github/workflows/update-tw-home.yml']
  schedule:
    # UTC 21:30 = the following day 05:30 in Asia/Taipei, every day.
    # Retry morning sources that are still publishing, then retain close retries.
    - cron: '30 21 * * *'
    - cron: '45 21 * * *'
    - cron: '15 22 * * *'
    # Retry completed night/US close sources before the 08:30 Taipei briefing.
    - cron: '20 0 * * 1-5'
    - cron: '30 0 * * 1-5'
    - cron: '35 5 * * *'
    - cron: '40 5 * * 1-5'
    - cron: '15 6 * * 1-5'
    - cron: '45 7 * * 1-5'
    - cron: '40 10 * * 1-5'
    - cron: '40 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tw-home-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/tw-home*.test.mjs
      - run: node scripts/collect-tw-home.mjs
      - name: Report source availability
        run: |
          node --input-type=module -e 'import fs from "node:fs";const d=JSON.parse(fs.readFileSync("data/tw-home.json"));for(const s of ["core","briefing","night"]){const r=d[s+"Status"];if(r?.error)console.log("::warning title=TW "+s+"::"+r.error);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"- "+s+": "+r?.status+" · "+(d[s]?.date||d[s]?.tradeDate||"unavailable")+"\n");}'
      - name: Save verified source snapshots
        run: |
          git add data/tw-home.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(tw): update home close and market briefing"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
