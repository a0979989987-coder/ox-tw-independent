name: Update TW investor conferences
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/collect-tw-conferences.mjs', 'server/markets/tw/conferences.js', 'tests/tw-conferences.test.mjs', '.github/workflows/update-tw-conferences.yml']
  schedule:
    # UTC -> Taipei: 08:20 before the open, 16:20 after the close (after the K-line pack).
    - cron: '20 0 * * 1-5'
    - cron: '20 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tw-conferences-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    # Preview/manual runs on feature branches must never write production main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tw-conferences.test.mjs
      - name: Collect conferences with bounded retries
        run: |
          for attempt in 1 2 3; do
            if node scripts/collect-tw-conferences.mjs; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 20))"; fi
          done
          exit 1
      - name: Publish changed snapshot
        run: |
          git add data/tw-conferences.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(tw): update investor conferences"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
