name: Update TW screener and ETF holdings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-tw-screener.mjs'
      - 'server/markets/tw/screener-data.js'
      - 'server/markets/tw/etf-holdings.js'
      - 'src/markets/tw/screener/model.js'
      - '.github/workflows/update-tw-screener.yml'
  schedule:
    # Taipei 14:50 / 17:50 / 21:50. Uses last verified price and candle snapshot.
    - cron: '50 6,9,13 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tw-screener-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tw-screener.test.mjs
      - run: node scripts/collect-tw-screener.mjs
      - name: Save verified snapshots
        run: |
          git add data/tw-screener.json.gz data/tw-screener-flows.json.gz data/tw-etf-holdings.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(tw): refresh stock screening and ETF holdings'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
