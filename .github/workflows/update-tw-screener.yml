name: Update TW screener and ETF holdings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-tw-screener.mjs'
      - 'server/markets/tw/screener-data.js'
      - 'server/markets/tw/etf-holdings.js'
      - 'src/markets/tw/screener/model.js'
      - '.github/workflows/update-tw-screener.yml'
  schedule:
    # Taipei 14:50 / 17:50 / 21:50. Uses last verified price and candle snapshot.
    - cron: '50 6,9,13 * * 1-5'
permissions: {}
concurrency:
  group: tw-screener-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tw-screener.test.mjs
      - run: node scripts/collect-tw-screener.mjs
      - name: Package changed data
        id: package
        env:
          DATA_PATHS: data/tw-screener.json.gz data/tw-screener-flows.json.gz data/tw-etf-holdings.json
        run: |
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $DATA_PATHS)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # shellcheck disable=SC2086
          tar -czf "$RUNNER_TEMP/data-update.tgz" -- $DATA_PATHS
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.changed == 'true'
        with:
          name: tw-screener-data
          path: ${{ runner.temp }}/data-update.tgz
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/commit-data.yml
    with:
      artifact: tw-screener-data
      paths: data/tw-screener.json.gz data/tw-screener-flows.json.gz data/tw-etf-holdings.json
      message: 'data(tw): refresh stock screening and ETF holdings'
